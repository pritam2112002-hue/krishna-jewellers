<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krishna Jewellers — Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f5f0;color:#222}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#171717,#51452c)}
.loginbox{background:#fff;width:100%;max-width:420px;padding:35px;border-radius:18px;box-shadow:0 20px 60px #0005}
.logo{text-align:center;font-family:Georgia,serif;font-size:28px;font-weight:bold}
.gold{text-align:center;color:#9b792c;margin:7px 0 28px}
.field{margin:13px 0}
.field label{display:block;font-size:13px;margin-bottom:6px;font-weight:bold}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;background:#fff}
.primary{width:100%;border:0;background:#191919;color:white;padding:13px;border-radius:8px;font-weight:bold}
.msg{margin-top:12px;text-align:center;font-size:13px;color:#b3261e}

.top{height:68px;background:#171717;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.top b{font-family:Georgia,serif;font-size:20px}
.layout{display:flex;min-height:calc(100vh - 68px)}
.side{width:220px;background:white;border-right:1px solid #e7e2d8;padding:20px 12px}
.side button{display:block;width:100%;text-align:left;border:0;background:none;padding:13px;border-radius:8px;margin-bottom:5px}
.side button:hover,.side button.active{background:#f1ece1}
.main{flex:1;padding:28px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}
.card{background:white;padding:20px;border-radius:12px;border:1px solid #eee}
.card small{color:#777}.card strong{display:block;font-size:27px;margin-top:8px}
.panel{background:white;border:1px solid #eee;border-radius:12px;padding:20px;margin-top:18px}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:7px;padding:9px 13px}
.dark{background:#191919;color:white}.light{background:#eee}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{text-align:left;border-bottom:1px solid #eee;padding:11px;font-size:14px}
.badge{background:#eee;padding:5px 8px;border-radius:20px;font-size:12px}
#productForm{max-width:750px}
@media(max-width:800px){
.side{width:70px}.side button{font-size:0}.side button:first-letter{font-size:18px}
.cards{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.main{padding:15px}
}
</style>
</head>

<body>

<div id="loginPage" class="login">
 <div class="loginbox">
  <div class="logo">KRISHNA JEWELLERS</div>
  <div class="gold">ADMIN PANEL</div>

  <div class="field">
   <label>Email</label>
   <input id="email" type="email" placeholder="Admin email">
  </div>

  <div class="field">
   <label>Password</label>
   <input id="password" type="password" placeholder="Password">
  </div>

  <button class="primary" onclick="login()">LOGIN</button>
  <div id="loginMsg" class="msg"></div>
 </div>
</div>

<div id="adminPage" class="hidden">
 <div class="top">
  <b>KRISHNA JEWELLERS — ADMIN PANEL</b>
  <button class="btn light" onclick="logout()">Logout</button>
 </div>

 <div class="layout">
  <aside class="side">
   <button onclick="showPage('dashboard')" class="active">📊 Dashboard</button>
   <button onclick="showPage('products')">💎 Products</button>
   <button onclick="showPage('categories')">📁 Categories</button>
   <button onclick="showPage('orders')">📦 Orders</button>
   <button onclick="showPage('banners')">🖼️ Banners</button>
  </aside>

  <main class="main">

   <section id="dashboard">
    <h1>Dashboard</h1>
    <p>Welcome to Krishna Jewellers Admin Panel.</p>
    <div class="cards">
     <div class="card"><small>Total Products</small><strong id="totalProducts">0</strong></div>
     <div class="card"><small>Total Orders</small><strong id="totalOrders">0</strong></div>
     <div class="card"><small>Pending Orders</small><strong id="pendingOrders">0</strong></div>
     <div class="card"><small>Low Stock</small><strong id="lowStock">0</strong></div>
    </div>
   </section>

   <section id="products" class="hidden">
    <div class="actions">
     <h1 style="flex:1">Products</h1>
     <button class="btn dark" onclick="toggleProductForm()">+ Add Product</button>
    </div>

    <div id="productForm" class="panel hidden">
     <h3>Add Product</h3>
     <div class="row">
      <div class="field"><label>Product Name</label><input id="pName"></div>
      <div class="field"><label>Category</label><input id="pCategory"></div>
      <div class="field"><label>MRP ₹</label><input id="pMrp" type="number"></div>
      <div class="field"><label>Selling Price ₹</label><input id="pPrice" type="number"></div>
      <div class="field"><label>Weight (g)</label><input id="pWeight" type="number" step="0.01"></div>
      <div class="field"><label>Purity</label><input id="pPurity" placeholder="e.g. Silver"></div>
      <div class="field"><label>Stock Quantity</label><input id="pStock" type="number" value="1"></div>
      <div class="field"><label>Main Image URL</label><input id="pImage"></div>
     </div>
     <div class="field"><label>Description</label><textarea id="pDescription" rows="3"></textarea></div>
     <button class="btn dark" onclick="addProduct()">Save Product</button>
     <span id="productMsg"></span>
    </div>

    <div class="panel">
     <table>
      <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead>
      <tbody id="productRows"></tbody>
     </table>
    </div>
   </section>

   <section id="categories" class="hidden">
    <h1>Categories</h1>
    <div class="panel">
     <div class="row">
      <div class="field"><label>Category Name</label><input id="categoryName" placeholder="Payal, Kada, Ring..."></div>
     </div>
     <button class="btn dark" onclick="addCategory()">Add Category</button>
     <div id="categoryList"></div>
    </div>
   </section>

   <section id="orders" class="hidden">
    <h1>Orders</h1>
    <div class="panel">
     <table>
      <thead><tr><th>Order</th><th>Customer</th><th>Mobile</th><th>Total</th><th>Status</th></tr></thead>
      <tbody id="orderRows"></tbody>
     </table>
    </div>
   </section>

   <section id="banners" class="hidden">
    <h1>Banners & Offers</h1>
    <div class="panel">
     <div class="row">
      <div class="field"><label>Banner Title</label><input id="bannerTitle"></div>
      <div class="field"><label>Image URL</label><input id="bannerImage"></div>
     </div>
     <button class="btn dark" onclick="addBanner()">Add Banner</button>
     <div id="bannerList"></div>
    </div>
   </section>

  </main>
 </div>
</div>

<script>
const SUPABASE_URL='https://aaklyglxbmmoplqjnydc.supabase.co';
const SUPABASE_KEY='sb_publishable_q94JRTYm8XwuDVfsTvlxwA_A3sJR2Re';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function login(){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const msg=document.getElementById('loginMsg');
 msg.textContent='Checking...';

 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){msg.textContent=error.message;return;}

 const {data:admin,error:adminError}=await db
   .from('admin_users')
   .select('role,is_active')
   .eq('user_id',data.user.id)
   .eq('is_active',true)
   .maybeSingle();

 if(adminError || !admin){
   await db.auth.signOut();
   msg.textContent='Admin access not allowed.';
   return;
 }

 openAdmin();
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function openAdmin(){
 document.getElementById('loginPage').classList.add('hidden');
 document.getElementById('adminPage').classList.remove('hidden');
 await refreshAll();
}

function showPage(id){
 ['dashboard','products','categories','orders','banners'].forEach(x=>
   document.getElementById(x).classList.add('hidden')
 );
 document.getElementById(id).classList.remove('hidden');
}

function toggleProductForm(){
 document.getElementById('productForm').classList.toggle('hidden');
}

async function loadProducts(){
 const {data,error}=await db.from('Product').select('*').order('created_at',{ascending:false});
 if(error)return console.error(error);

 document.getElementById('totalProducts').textContent=data.length;
 document.getElementById('lowStock').textContent=data.filter(x=>(x.stock_quantity||0)<=1).length;

 document.getElementById('productRows').innerHTML=data.map(p=>`
 <tr>
  <td>${p.name||''}</td>
  <td>${p.category||''}</td>
  <td>₹${p.price??''}</td>
  <td>${p.stock_quantity??0}</td>
  <td><span class="badge">${p.is_sold_out?'Sold Out':'Active'}</span></td>
 </tr>`).join('');
}

async function addProduct(){
 const item={
  name:pName.value.trim(),
  category:pCategory.value.trim(),
  mrp:Number(pMrp.value)||null,
  price:Number(pPrice.value)||null,
  weight:Number(pWeight.value)||null,
  purity:pPurity.value.trim(),
  stock_quantity:Number(pStock.value)||0,
  image_url:pImage.value.trim()||null,
  description:pDescription.value.trim(),
  is_active:true,
  is_sold_out:(Number(pStock.value)||0)<=0
 };

 const {error}=await db.from('Product').insert(item);
 productMsg.textContent=error?error.message:' Product saved ✓';
 if(!error)loadProducts();
}

async function loadCategories(){
 const {data,error}=await db.from('categories').select('*').order('sort_order');
 if(error)return;
 categoryList.innerHTML=data.map(c=>`<p>• ${c.name}</p>`).join('');
}

async function addCategory(){
 const name=categoryName.value.trim();
 if(!name)return;
 const {error}=await db.from('categories').insert({name});
 if(!error){categoryName.value='';loadCategories();}
}

async function loadOrders(){
 const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});
 if(error)return;

 totalOrders.textContent=data.length;
 pendingOrders.textContent=data.filter(o=>o.order_status!=='Delivered').length;

 orderRows.innerHTML=data.map(o=>`
 <tr>
  <td>${o.order_number||o.id}</td>
  <td>${o.customer_name||''}</td>
  <td>${o.mobile||''}</td>
  <td>₹${o.total_amount||0}</td>
  <td>${o.order_status||''}</td>
 </tr>`).join('');
}

async function loadBanners(){
 const {data,error}=await db.from('banners').select('*').order('sort_order');
 if(error)return;
 bannerList.innerHTML=data.map(b=>`<p>• ${b.title||'Banner'}</p>`).join('');
}

async function addBanner(){
 const title=bannerTitle.value.trim();
 const image_url=bannerImage.value.trim();
 const {error}=await db.from('banners').insert({title,image_url});
 if(!error){bannerTitle.value='';bannerImage.value='';loadBanners();}
}

async function refreshAll(){
 await Promise.all([loadProducts(),loadCategories(),loadOrders(),loadBanners()]);
}

(async()=>{
 const {data}=await db.auth.getSession();
 if(data.session){
   const {data:admin}=await db.from('admin_users')
    .select('role,is_active')
    .eq('user_id',data.session.user.id)
    .eq('is_active',true)
    .maybeSingle();
   if(admin)openAdmin();
 }
})();
</script>
</body>
</html>
